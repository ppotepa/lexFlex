[workspace]
resolver = "2"

members = [
    "crates/lexflex-model",
    "crates/lexflex-lingua",
    "crates/lexflex-language",
    "crates/lexflex-parser",
    "crates/lexflex-store",
    "crates/lexflex-engine",
    "crates/lexflex-learning",
    "crates/lexflex-provider-llm",
    "crates/lexflex-generation",
    "crates/lexflex-conversation",
    "crates/lexflex-documents",
    "apps/lexflex",
    "tools/lexflex-benchmark",
    "tools/lexflex-model-inspect",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
ron = "0.8"
clap = { version = "4", features = ["derive"] }
