[package]
name = "lexflex-learner"
version = "0.1.0"
edition = "2021"
authors = ["lexFlex contributors"]
description = "Lexical deduction service for lexFlex. Queries free APIs to learn new words, infer features and Interlingua concepts. Usable as CLI or crate."
license = "MIT"
repository = "https://github.com/ppotepa/lexFlex"

[lib]
name = "lexflex_learner"
path = "src/lib.rs"

[[bin]]
name = "lexlearn"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tokio = { version = "1.39", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ron = "0.8"
urlencoding = "2.1"
async-trait = "0.1"
idna = "=0.5.0"  # pin to avoid rustc 1.86 requirement from newer icu

[dev-dependencies]
tokio-test = "0.4"
